name: Deploy to S3

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      release:
        description: "Release to rollback"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create release name
        id: release
        run: echo "RELEASE=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Upload to versioned folder
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }}/releases/${{ steps.release.outputs.RELEASE }}

      - name: Update current folder
        run: |
          aws s3 rm s3://${{ secrets.AWS_S3_BUCKET }}/current --recursive
          aws s3 cp \
            s3://${{ secrets.AWS_S3_BUCKET }}/releases/${{ steps.release.outputs.RELEASE }} \
            s3://${{ secrets.AWS_S3_BUCKET }}/current \
            --recursive

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
